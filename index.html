const S={tab:0,days:load("trip_days",DAYS_INIT),items:load("trip_items",ITEMS_INIT),done:load("trip_done",{}),actual:load("trip_actual",{}),notes:load("trip_daynotes",{}),ess:load("trip_ess",{}),day:"d1",expanded:null,modal:null,clock:new Date()};
function load(k,x){try{let v=localStorage.getItem(k);return v?JSON.parse(v):JSON.parse(JSON.stringify(x))}catch{return JSON.parse(JSON.stringify(x))}}
function save(){["days","items","done","actual","notes","ess"].forEach(k=>localStorage.setItem("trip_"+({notes:"daynotes",ess:"ess"}[k]||k),JSON.stringify(S[k])))}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(n){return Number(n||0).toLocaleString("vi-VN")+"đ"} function mins(t){let [h,m]=(t||"00:00").split(":").map(Number);return h*60+m}
function map(x){return "https://maps.google.com/?q="+encodeURIComponent((x||"").split("/")[0].split("\n")[0])}
function totals(){let p=0,a=0;S.items.forEach(i=>{let q=(+i.budget||0)+(+i.travel||0);p+=q;a+=S.actual[i.id]!==undefined?+S.actual[i.id]:q});let d=Object.values(S.done).filter(Boolean).length;return[p,a,d,S.items.length?Math.round(d/S.items.length*100):0]}
function today(){let d=S.clock,ds=String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0"),day=S.days.find(x=>x.date===ds),next=null;if(day){let a=S.items.filter(x=>x.dayId===day.id).sort((x,y)=>x.time.localeCompare(y.time)),n=d.getHours()*60+d.getMinutes();next=a.find(x=>n>=mins(x.time)&&n<mins(x.endTime)+60)||a.find(x=>mins(x.time)>n)}let left=Math.ceil((new Date("2026-08-09")-d)/86400000);return[next,left]}
function done(id){S.done[id]=!S.done[id];save();render()} function actual(id,v){S.actual[id]=parseInt(v)||0;save();render()} function note(id,v){S.notes[id]=v;save()}
function dayPick(){return '<div class="days">'+S.days.map(d=>{let a=S.items.filter(x=>x.dayId===d.id),n=a.filter(x=>S.done[x.id]).length;return `<button class="day ${S.day===d.id?"on":""}" onclick="S.day='${d.id}';render()"><b>${d.date}</b><small>${esc(d.city)}</small><small>${n}/${a.length}</small></button>`}).join("")+"</div>"}
function overview(){let[p,a,d,c]=totals(),e=ESS.filter(x=>S.ess[x[0]]).length,o=a>p;return `<div class="grid"><div class="stat"><b>5</b><small>Ngày</small></div><div class="stat"><b>${d}/${S.items.length}</b><small>Xong</small></div><div class="stat"><b>${c}%</b><small>Kế hoạch</small></div></div>
<div class="card"><div class="st">💰 Chi tiêu</div><div class="row"><span class="muted">Dự kiến</span><b>${fmt(p)}</b></div><div class="row"><span class="muted">Thực chi</span><b class="${o?"over":"under"}">${fmt(a)}</b></div><div class="barbg"><div class="bar" style="width:${p?Math.min(100,a/p*100):0}%;background:${o?"#e74c3c":"#e67e22"}"></div></div><div class="${o?"over":"under"}" style="font-size:11px;text-align:right;margin-top:4px">${o?"⚠️ Vượt "+fmt(a-p):"✓ Còn "+fmt(p-a)}</div></div>
<div class="card"><div class="row"><b>📋 Checklist chuẩn bị</b><span>${e}/${ESS.length}</span></div>${ESS.map(x=>`<label class="check"><input type="checkbox" ${S.ess[x[0]]?"checked":""} onchange="S.ess['${x[0]}']=this.checked;save();render()"><span style="${S.ess[x[0]]?"text-decoration:line-through;color:#999":""}">${x[1]} ${esc(x[2])}</span></label>`).join("")}</div>
<div class="st">📝 Ghi chú từng ngày</div>${S.days.map(d=>`<div class="card"><div style="color:var(--o);font-size:12px;font-weight:600;margin-bottom:5px">${d.date} — ${esc(d.city)}</div><textarea class="note" placeholder="Cảm nhận, review, ghi nhớ..." oninput="note('${d.id}',this.value)">${esc(S.notes[d.id]||"")}</textarea></div>`).join("")}`}
function planner(){let a=S.items.filter(i=>i.dayId===S.day).sort((x,y)=>x.time.localeCompare(y.time));return dayPick()+`<button class="add" onclick="newItem()">+ Thêm hoạt động</button>`+a.map((i,k)=>{let q=(+i.budget||0)+(+i.travel||0),ac=S.actual[i.id]!==undefined?+S.actual[i.id]:q,df=ac-q,nd=a[k+1];return `<div class="trow"><div class="time">${i.time}<div class="line" style="background:${S.done[i.id]?"#ccc":"#e67e22"}"></div></div><div class="item ${S.done[i.id]?"done":""}"><div class="itemhead"><div><div class="act">${esc(i.activity)}</div>${i.location?`<div class="loc">${esc(i.location)}</div>`:""}</div><div><button onclick='editItem(${JSON.stringify(i)})' style="border:0;background:none">✏️</button><button onclick="done('${i.id}')" style="border:1px solid #ddd;background:${S.done[i.id]?"#eaf3de":"#fff"};border-radius:6px">${S.done[i.id]?"✓":"Xong"}</button></div></div><div class="meta"><span>⏰ ${i.time}–${i.endTime}</span>${i.transport?`<span>🚗 ${esc(i.transport)}</span>`:""}${q?`<span class="money">💰 ${fmt(q)}</span>`:""}${i.note?`<button onclick="S.expanded=S.expanded==='${i.id}'?null:'${i.id}';render()">📝 Lưu ý ${S.expanded===i.id?"▲":"▼"}</button>`:""}${i.location?`<a class="maps" href="${map(i.location)}" target="_blank">🗺 Maps</a>`:""}</div>${S.expanded===i.id?`<div style="margin-top:6px;background:#e6f1fb;padding:7px;border-radius:7px;font-size:12px;color:#0c447c">⚠️ ${esc(i.note)}</div>`:""}${q?`<div class="actual">Thực chi:<input type="number" value="${ac}" onchange="actual('${i.id}',this.value)">đ ${df?`<b class="diff ${df>0?"over":"under"}">${df>0?"+":""}${fmt(df)}</b>`:""}</div>`:""}</div></div>${i.location&&nd?.location?`<div style="margin:0 0 5px 44px;font-size:10px"><a href="${"https://maps.google.com/maps/dir/"+encodeURIComponent(i.location.split("/")[0])+"/"+encodeURIComponent(nd.location.split("/")[0])}" target="_blank">🧭 Đường đi →</a></div>`:""}`}).join("")}
function budget(){let[p,a]=totals(),o=a>p,s='<div class="card"><div class="st">💰 Tổng chi tiêu chuyến đi</div>';S.days.forEach(d=>{let z=S.items.filter(i=>i.dayId===d.id),P=z.reduce((s,i)=>s+(+i.budget||0)+(+i.travel||0),0),A=z.reduce((s,i)=>s+(S.actual[i.id]!==undefined?+S.actual[i.id]:(+i.budget||0)+(+i.travel||0)),0);if(P)s+=`<div class="row" style="border-bottom:1px solid var(--b)"><span class="muted">${d.date} ${esc(d.city)}</span><span><b>${fmt(A)}</b> / ${fmt(P)}</span></div>`});s+=`<div class="row" style="font-weight:700"><b>TỔNG</b><b class="${o?"over":"under"}">${fmt(a)}</b></div><div class="${o?"over":"under"}" style="font-size:11px;text-align:right">${o?"⚠️ Vượt "+fmt(a-p):"✓ Tiết kiệm "+fmt(p-a)}</div></div>`;S.days.forEach(d=>{let z=S.items.filter(i=>i.dayId===d.id&&((+i.budget||0)+(+i.travel||0)));if(!z.length)return;s+=`<div class="st" style="color:var(--o)">${d.date} — ${esc(d.city)}</div>`;z.forEach(i=>{let q=(+i.budget||0)+(+i.travel||0),ac=S.actual[i.id]!==undefined?+S.actual[i.id]:q;s+=`<div class="card"><div class="row"><span>${esc(i.activity)}</span><span>KH: ${fmt(q)}</span></div><div class="actual">Thực chi:<input type="number" value="${ac}" onchange="actual('${i.id}',this.value)">đ</div></div>`})});return s}
function reminders(){let a=S.items.filter(i=>i.dayId===S.day).sort((x,y)=>x.time.localeCompare(y.time)),n=a.filter(i=>S.done[i.id]).length,s=n===a.length&&a.length;return (s?`<div class="finish">🎉<br><b>Xong ngày ${S.days.find(d=>d.id===S.day)?.date}!</b><br><small>Nghỉ ngơi đi, mai còn vui hơn 🌴</small></div>`:"")+dayPick()+a.map(i=>`<div class="ritem ${S.done[i.id]?"done":""}"><div class="rtime">${i.time}</div><div class="rbody"><div class="rtitle">${esc(i.activity)}</div>${i.location?`<div class="loc">${esc(i.location.split("/")[0])}</div>`:""}${i.note?`<div class="rnote">⚠️ ${esc(i.note)}</div>`:""}${i.location?`<div><a href="${map(i.location)}" target="_blank">🗺 Maps</a></div>`:""}</div><button onclick="done('${i.id}')">${S.done[i.id]?"✓":"Xong"}</button></div>`).join("")}
function newItem(){S.modal={id:"",dayId:S.day,time:"09:00",endTime:"10:00",activity:"",location:"",transport:"",budget:0,travel:0,note:""};render()}
function editItem(i){S.modal={...i};render()}
function modal(){let i=S.modal;let f=(l,k,t,p="")=>`<div class="field"><label>${l}</label>${t==="textarea"?`<textarea id="f_${k}" rows="2">${esc(i[k]||"")}</textarea>`:`<input id="f_${k}" type="${t}" value="${esc(i[k]??"")}" placeholder="${p}">`}</div>`;return `<div class="modalbg" onclick="if(event.target===this)S.modal=null;render()"><div class="modal"><h3>${i.id?"Chỉnh sửa hoạt động":"Thêm hoạt động"}</h3>${f("Hoạt động *","activity","text","Tên hoạt động")}${f("Địa điểm","location","textarea")}${f("Bắt đầu","time","time")}${f("Kết thúc","endTime","time")}${f("Di chuyển","transport","text")}${f("Budget (đ)","budget","number")}${f("Di chuyển (đ)","travel","number")}${f("Lưu ý","note","textarea")}<div class="actions">${i.id?`<button class="btn del" onclick="S.items=S.items.filter(x=>x.id!=='${i.id}');S.modal=null;save();render()">🗑 Xóa</button>`:""}<button class="btn" onclick="S.modal=null;render()">Hủy</button><button class="btn save" onclick="saveItem()">✓ Lưu</button></div></div></div>`}
function saveItem(){let i=S.modal;["activity","location","time","endTime","transport","note"].forEach(k=>i[k]=document.getElementById("f_"+k).value);["budget","travel"].forEach(k=>i[k]=parseInt(document.getElementById("f_"+k).value)||0);if(i.id)S.items=S.items.map(x=>x.id===i.id?i:x);else S.items.push({...i,id:"i"+Date.now()});S.items.sort((a,b)=>a.dayId.localeCompare(b.dayId)||a.time.localeCompare(b.time));S.modal=null;save();render()}
function render(){let [next,left]=today(),tabs=TABS.map((t,i)=>`<button class="tab ${S.tab===i?"on":""}" onclick="S.tab=${i};render()">${t[0]}<div>${t[1]}</div></button>`).join("");document.getElementById("app").innerHTML=`<div class="header"><div class="hr"><div><div class="title">🌴 Hội An · Đà Nẵng · Huế</div><div class="sub">09 – 13/08/2026</div></div><div class="clock"><b>${S.clock.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})}</b><br><small>${left>0?left+" ngày nữa 🎒":left===0?"Hôm nay! 🎉":"Đang đi ✈️"}</small></div></div></div>${next?`<div class="next"><small>🔴 Tiếp theo</small><b>${esc(next.activity)}</b>${next.location?`<div style="font-size:11px">📍 ${esc(next.location.split("/")[0])}</div>`:""}<span class="pill">⏰ ${next.time}–${next.endTime}</span>${next.transport?`<span class="pill">🚗 ${esc(next.transport)}</span>`:""}${next.location?`<a class="pill" href="${map(next.location)}" target="_blank">Maps →</a>`:""}</div>`:""}<div class="tabs">${tabs}</div><div class="content">${S.tab===0?overview():S.tab===1?planner():S.tab===2?budget():reminders()}</div>${S.modal?modal():""}`};render();setInterval(()=>{S.clock=new Date();render()},30000);
</script></body></html>
