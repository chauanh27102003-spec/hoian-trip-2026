<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#C0392B"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a90d4"/>
      <stop offset="100%" style="stop-color:#54c8f0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE066"/>
      <stop offset="100%" style="stop-color:#FFB300"/>
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5CBA7"/>
      <stop offset="100%" style="stop-color:#E59866"/>
    </linearGradient>
    <linearGradient id="sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2980b9"/>
      <stop offset="100%" style="stop-color:#1a6fa8"/>
    </linearGradient>
    <linearGradient id="palm1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60"/>
      <stop offset="100%" style="stop-color:#1E8449"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Sky -->
  <rect x="0" y="0" width="512" height="340" rx="112" ry="112" fill="url(#sky)" clip-path="url(#round)"/>
  <rect x="0" y="200" width="512" height="140" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="360" cy="130" r="70" fill="#FFE066" opacity="0.18"/>
  <circle cx="360" cy="130" r="52" fill="url(#sun)" opacity="0.9"/>

  <!-- Sun rays -->
  <g opacity="0.55" stroke="#FFE066" stroke-width="5" stroke-linecap="round">
    <line x1="360" y1="62" x2="360" y2="44"/>
    <line x1="360" y1="198" x2="360" y2="216"/>
    <line x1="292" y1="130" x2="274" y2="130"/>
    <line x1="428" y1="130" x2="446" y2="130"/>
    <line x1="312" y1="82" x2="300" y2="70"/>
    <line x1="408" y1="178" x2="420" y2="190"/>
    <line x1="408" y1="82" x2="420" y2="70"/>
    <line x1="312" y1="178" x2="300" y2="190"/>
  </g>

  <!-- Sea -->
  <ellipse cx="256" cy="330" rx="280" ry="38" fill="url(#sea)" opacity="0.95"/>
  <rect x="0" y="330" width="512" height="80" fill="url(#sea)"/>

  <!-- Sea shimmer -->
  <ellipse cx="180" cy="335" rx="60" ry="6" fill="white" opacity="0.12"/>
  <ellipse cx="340" cy="342" rx="40" ry="4" fill="white" opacity="0.10"/>

  <!-- Sand -->
  <ellipse cx="256" cy="400" rx="280" ry="55" fill="url(#sand)"/>
  <rect x="0" y="400" width="512" height="112" fill="#F5CBA7"/>
  <!-- sand texture -->
  <ellipse cx="256" cy="400" rx="280" ry="55" fill="url(#sand)" opacity="0.6"/>

  <!-- Palm tree LEFT -->
  <!-- trunk -->
  <path d="M130 430 Q118 370 125 300 Q128 270 135 240" stroke="#8B6914" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- leaves -->
  <ellipse cx="102" cy="218" rx="52" ry="16" fill="url(#palm1)" transform="rotate(-30 102 218)"/>
  <ellipse cx="158" cy="208" rx="52" ry="16" fill="#2ECC71" transform="rotate(20 158 208)"/>
  <ellipse cx="126" cy="195" rx="52" ry="16" fill="url(#palm1)" transform="rotate(-5 126 195)"/>
  <ellipse cx="96" cy="200" rx="48" ry="14" fill="#27AE60" transform="rotate(-55 96 200)"/>
  <ellipse cx="165" cy="225" rx="50" ry="14" fill="#2ECC71" transform="rotate(45 165 225)"/>
  <!-- coconuts -->
  <circle cx="130" cy="237" r="8" fill="#8B4513"/>
  <circle cx="142" cy="232" r="7" fill="#9B5523"/>

  <!-- Palm tree RIGHT (smaller, behind) -->
  <path d="M390 440 Q400 385 395 320 Q392 290 386 262" stroke="#7A5C12" stroke-width="11" fill="none" stroke-linecap="round"/>
  <ellipse cx="368" cy="242" rx="44" ry="13" fill="#27AE60" transform="rotate(-25 368 242)"/>
  <ellipse cx="412" cy="236" rx="44" ry="13" fill="url(#palm1)" transform="rotate(25 412 236)"/>
  <ellipse cx="384" cy="228" rx="44" ry="13" fill="#2ECC71" transform="rotate(0 384 228)"/>
  <ellipse cx="360" cy="248" rx="42" ry="12" fill="#1E8449" transform="rotate(-50 360 248)"/>

  <!-- Small boat -->
  <path d="M220 318 Q256 308 292 318 L286 330 Q256 336 226 330 Z" fill="#E8D5A3" opacity="0.95"/>
  <rect x="253" y="298" width="3" height="22" fill="#8B6914"/>
  <path d="M256 298 L280 306 L256 310 Z" fill="#E74C3C" opacity="0.9"/>

  <!-- Wave lines -->
  <path d="M60 345 Q100 338 140 345 Q180 352 220 345" stroke="white" stroke-width="3" fill="none" opacity="0.25" stroke-linecap="round"/>
  <path d="M300 350 Q340 343 380 350 Q410 355 440 350" stroke="white" stroke-width="2.5" fill="none" opacity="0.2" stroke-linecap="round"/>

  <!-- Clouds -->
  <g opacity="0.82">
    <ellipse cx="80" cy="90" rx="38" ry="20" fill="white"/>
    <ellipse cx="108" cy="80" rx="30" ry="22" fill="white"/>
    <ellipse cx="52" cy="88" rx="24" ry="16" fill="white"/>
  </g>
  <g opacity="0.6">
    <ellipse cx="230" cy="68" rx="26" ry="14" fill="white"/>
    <ellipse cx="252" cy="60" rx="20" ry="16" fill="white"/>
    <ellipse cx="212" cy="66" rx="18" ry="12" fill="white"/>
  </g>

  <!-- Bottom brand strip -->
  <rect x="0" y="448" width="512" height="64" rx="0" fill="url(#bg)" opacity="0.85" clip-path="url(#round)"/>
  <rect x="0" y="460" width="512" height="52" fill="url(#bg)" opacity="0.85"/>
  <text x="256" y="494" font-family="-apple-system, 'SF Pro Display', Arial, sans-serif" font-size="36" font-weight="800" fill="white" text-anchor="middle" letter-spacing="1" opacity="0.97">TRIP 🌴</text>
</svg>
